name: Build and publish release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Windows installer
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Ensure NSIS is installed
        shell: pwsh
        run: |
          if (-not (Get-Command makensis.exe -ErrorAction SilentlyContinue)) {
            choco install nsis --yes --no-progress
            $nsisDirectory = Join-Path ${env:ProgramFiles(x86)} 'NSIS'
            if (Test-Path (Join-Path $nsisDirectory 'makensis.exe')) {
              $env:PATH = "$nsisDirectory;$env:PATH"
              Add-Content -Path $env:GITHUB_PATH -Value $nsisDirectory
            }
          }
          if (-not (Get-Command makensis.exe -ErrorAction SilentlyContinue)) {
            throw 'NSIS (makensis.exe) is required to build the Windows installer.'
          }

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Verify tag version and build installer
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $tagVersion = $env:RELEASE_TAG.TrimStart('v')
          $packageVersion = node -p "require('./package.json').version"
          $tauriVersion = node -p "require('./src-tauri/tauri.conf.json').version"
          if ($tagVersion -ne $packageVersion -or $tagVersion -ne $tauriVersion) {
            throw "Release tag '$($env:RELEASE_TAG)' must match package and Tauri versions ($packageVersion / $tauriVersion)."
          }
          npm run build:installer

      - name: Prepare checksums and release notes
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $versionNumber = $env:RELEASE_TAG.TrimStart('v')
          $installerPath = Join-Path 'src-tauri/target/release/bundle/nsis' "CyberFiles_${versionNumber}_x64-setup.exe"
          if (-not (Test-Path -LiteralPath $installerPath)) {
            throw "Expected NSIS installer not found: $installerPath"
          }

          $installer = Get-Item -LiteralPath $installerPath
          $installerHash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksumPath = Join-Path $installer.DirectoryName 'SHA256SUMS.txt'
          [System.IO.File]::WriteAllText($checksumPath, "$installerHash  $($installer.Name)`n", [System.Text.UTF8Encoding]::new($false))

          $releaseSummary = (git tag --list --format='%(contents)' $env:RELEASE_TAG | Out-String).Trim()
          if ([string]::IsNullOrWhiteSpace($releaseSummary)) {
            throw 'Create an annotated release tag with a concise user-facing summary in its message.'
          }

          $template = [System.IO.File]::ReadAllText('.github/release-template.md', [System.Text.Encoding]::UTF8)
          $notes = $template.Replace('{{VERSION}}', $env:RELEASE_TAG).
            Replace('{{RELEASE_SUMMARY}}', $releaseSummary).
            Replace('{{VERSION_NUM}}', $versionNumber).
            Replace('{{SETUP_SHA256}}', $installerHash)
          [System.IO.File]::WriteAllText('release_notes.md', $notes, [System.Text.UTF8Encoding]::new($false))
          Write-Host "Installer: $($installer.Name)"
          Write-Host "SHA-256: $installerHash"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: CyberFiles ${{ github.ref_name }}
          draft: false
          prerelease: ${{ startsWith(github.ref_name, 'v0.') || contains(github.ref_name, '-') }}
          body_path: release_notes.md
          fail_on_unmatched_files: true
          files: |
            src-tauri/target/release/bundle/nsis/CyberFiles_*_x64-setup.exe
            src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}