version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: cargo
    directory: "/src-tauri"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # 0.x crates: a minor bump is a breaking change, so these need a planned migration
      - dependency-name: "windows"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "windows-core"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "unrar-rs"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
