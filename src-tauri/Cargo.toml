[package]
name = "cyberfiles"
version = "0.6.1"
default-run = "CyberFiles"
description = "CyberFiles desktop development shell"
authors = ["CyberGems"]
license = "GPL-3.0-only"
edition = "2021"

[[bin]]
name = "CyberFiles"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "tiff", "webp"] }
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
# The updater ships its own TLS stack by default; on Windows the updater should
# use the system one, and `zip` is required by the updater's archive handling.
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "zip"] }
tauri-plugin-process = "2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_Security", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_WindowsProgramming", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows = { version = "0.61", features = ["Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_SystemServices", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging"] }
# `#[implement]` expands to `::windows_core::…` paths, which only resolve for a crate that
# depends on it directly. Kept on the same minor as `windows` so both share one build.
windows-core = "0.61"
tauri-plugin-opener = "2.5.5"

zip = { version = "4.6.1", default-features = false, features = ["deflate-flate2", "aes-crypto"] }
unrar-rs = { version = "=0.3.1", default-features = false, features = ["crypto-rust"] }
